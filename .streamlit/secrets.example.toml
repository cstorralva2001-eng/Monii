# Copy to secrets.toml. Never commit real credentials.
# Local use requires none of these settings.
MONII_ENV = "production"
MONII_AUTH = "oidc"
DATABASE_URL = "postgresql://USER:PASSWORD@HOST:5432/monii?sslmode=require"

# Optional external assistant; choose a model available in your Google account.
# GEMINI_API_KEY = "YOUR_KEY"
# GEMINI_MODEL = "YOUR_ENABLED_MODEL_ID"

[auth]
redirect_uri = "https://YOUR-DOMAIN/oauth2callback"
cookie_secret = "REPLACE_WITH_A_LONG_RANDOM_SECRET"
client_id = "YOUR_OIDC_CLIENT_ID"
client_secret = "YOUR_OIDC_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
